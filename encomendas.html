    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="L'Artisan Boulangerie" class="brand__logo">

    <nav class="nav-desktop" aria-label="Navegação principal">
      <a class="nav-link nav-link--active" href="index.html">Início</a>
      <a class="nav-link" href="produtos.html">Produtos</a>
      <a class="nav-link" href="./encomendas.html">Encomendas</a>
      <a class="nav-link" href="#contato">Contato</a>

    <button class="nav-toggle" type="button" id="navToggle" aria-expanded="false" aria-controls="navMobile" aria-label="Abrir menu">

    </button>

  <nav class="nav-mobile" id="navMobile" aria-label="Navegação móvel" hidden>

  </nav>
</header>


<!-- ===== Encomendas ===== -->
<section class="section section--muted" id="encomendas">
  <div class="container">
    <div class="section__header">
      <span class="eyebrow">Encomendas</span>
      <h2 class="section-title section__title">Faça o seu Pedido</h2>
      <p class="section__desc">Preencha os dados abaixo e nossa equipe entra em contato para confirmar sua encomenda.</p>
    </div>

    <form class="order-form" id="orderForm" novalidate>
      <div class="form-row form-row--two">
        <div class="field">
          <label for="orderName">Nome completo</label>
          <input type="text" id="orderName" name="name" placeholder="Seu nome" required />
        </div>
        <div class="field">
          <label for="orderPhone">Telefone / WhatsApp</label>
          <input type="tel" id="orderPhone" name="phone" placeholder="(00) 00000-0000" required />
        </div>
      </div>

      <div class="form-row form-row--two">
        <div class="field">
          <label for="orderProduct">Produto</label>
          <select id="orderProduct" name="product" required>
            <option value="" disabled selected>Selecione um produto</option>
            <option value="Croissant Amanteigado">Croissant Amanteigado</option>
            <option value="Pão de Fermentação Natural">Pão de Fermentação Natural</option>
            <option value="Tarte au Citron">Tarte au Citron</option>
            <option value="Outro">Outro (descreva abaixo)</option>
          </select>
        </div>
        <div class="field">
          <label for="orderDate">Data de retirada</label>
          <input type="date" id="orderDate" name="date" required />
        </div>
      </div>

      <div class="field">
        <label for="orderNotes">Observações</label>
        <textarea id="orderNotes" name="notes" placeholder="Quantidade, restrições alimentares, personalizações..."></textarea>
      </div>

      <div class="form-feedback" id="orderFeedback" role="status"></div>

      <button class="btn btn--primary" type="submit">Enviar Encomenda</button>
    </form>
  </div>
</section>

<!-- ===== WhatsApp FAB ===== -->
<a class="whatsapp-fab" href="https://wa.me/556599943676?text=Olá!%20Gostaria%20de%20fazer%20uma%20encomenda." target="_blank" rel="noopener" aria-label="Contato via WhatsApp">
  <span class="material-symbols-outlined">chat</span>
</a>
